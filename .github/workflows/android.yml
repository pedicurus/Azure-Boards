name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets a run be started by hand (or by an automation whose pushes do not trigger CI).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests, debug build, R8 check, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Uses the Gradle version pinned in gradle/wrapper (checksum-verified); also caches downloads.
      - uses: gradle/actions/setup-gradle@v6

      # Some editors (e.g. Google AI Studio) drop the executable bit on gradlew when committing.
      - name: Make gradlew executable
        run: chmod +x gradlew

      # Maven Central rate-limits GitHub runners; see the comment in this init script.
      - name: Use Google's Maven Central mirror
        run: mkdir -p ~/.gradle/init.d && cp .github/gradle/maven-central-mirror.init.gradle.kts ~/.gradle/init.d/

      # Robolectric's Android runtime jar is large and downloaded outside Gradle's cache.
      - name: Cache Robolectric runtime
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      # The debug signing config points at a debug.keystore that is not committed.
      - name: Create throwaway debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Debug build
        run: ./gradlew :app:assembleDebug --stacktrace

      # Runs R8 on the release variant (no signing needed) to catch missing keep rules.
      - name: Release R8 shrink check
        run: ./gradlew :app:minifyReleaseWithR8 --stacktrace

      # Lint is reported but not yet blocking: existing findings need a baseline first.
      - name: Android Lint
        run: ./gradlew :app:lintDebug
        continue-on-error: true

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
