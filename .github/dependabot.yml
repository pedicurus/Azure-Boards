version: 2
updates:
  # Library and plugin versions in gradle/libs.versions.toml and the build scripts.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Google AI Studio runs unit tests offline with only the Android runtime that Robolectric
      # 4.16.x uses; newer Robolectric versions need a runtime jar it does not have.
      - dependency-name: "org.robolectric:robolectric"
    groups:
      compose:
        patterns: ["androidx.compose*"]
      androidx:
        patterns: ["androidx.*"]
        exclude-patterns: ["androidx.compose*"]
      networking:
        patterns: ["com.squareup.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*", "com.google.devtools.ksp"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
